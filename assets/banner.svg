<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #090d16 0%, #0d1b2a 40%, #1b263b 80%, #0d1b2a 100%);
          height: 240px;
          width: 100%;
          border-radius: 12px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          box-sizing: border-box;
          border: 1px solid rgba(0, 180, 216, 0.3);
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(0, 180, 216, 0.08);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          overflow: hidden;
        }

        .grid-bg {
          position: absolute;
          width: 100%;
          height: 100%;
          background-image: 
            linear-gradient(rgba(0, 180, 216, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 180, 216, 0.06) 1px, transparent 1px);
          background-size: 30px 30px;
          animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
          0% { background-position: 0 0; }
          100% { background-position: 30px 30px; }
        }

        .pulse-glow {
          position: absolute;
          width: 300px;
          height: 150px;
          background: radial-gradient(circle, rgba(0, 180, 216, 0.25) 0%, rgba(114, 9, 183, 0.15) 50%, transparent 70%);
          top: 45px;
          filter: blur(35px);
          animation: pulse 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
          0% { transform: scale(0.85); opacity: 0.6; }
          100% { transform: scale(1.2); opacity: 0.95; }
        }

        .content {
          position: relative;
          z-index: 2;
          text-align: center;
          padding: 0 20px;
        }

        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: rgba(0, 180, 216, 0.15);
          border: 1px solid rgba(0, 180, 216, 0.4);
          padding: 4px 14px;
          border-radius: 20px;
          color: #90e0ef;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          margin-bottom: 12px;
          animation: floatBadge 3s ease-in-out infinite alternate;
        }

        @keyframes floatBadge {
          0% { transform: translateY(0px); }
          100% { transform: translateY(-3px); }
        }

        .title {
          font-size: 34px;
          font-weight: 800;
          background: linear-gradient(90deg, #caf0f8 0%, #00b4d8 50%, #90e0ef 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0 0 10px 0;
          letter-spacing: -0.5px;
        }

        .subtitle {
          color: #e0e1dd;
          font-size: 13px;
          max-width: 650px;
          line-height: 1.5;
          margin: 0 auto;
          opacity: 0.9;
        }

        .tags {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin-top: 14px;
        }

        .tag {
          font-size: 11px;
          color: #7209b7;
          background: #caf0f8;
          padding: 3px 10px;
          border-radius: 6px;
          font-weight: 600;
        }
      </style>
      <div class="container">
        <div class="grid-bg"></div>
        <div class="pulse-glow"></div>
        <div class="content">
          <div class="badge">🛡️ Awesome Data Protection Ecosystem</div>
          <h1 class="title">Awesome Cloud Backup</h1>
          <p class="subtitle">Curated directory of SaaS enterprise platforms, open-source backup utilities, ransomware-resilient storage, and cloud disaster recovery tools.</p>
          <div class="tags">
            <span class="tag">⚡ SaaS &amp; Open Source</span>
            <span class="tag">🔒 Deduplication &amp; Encryption</span>
            <span class="tag">☁️ Multi-Cloud &amp; Kubernetes</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
